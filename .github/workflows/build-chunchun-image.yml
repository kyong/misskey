# chunchun.world 用の Docker イメージをビルドして ghcr.io に push する (kyong/misskey フォーク専用)。
# サーバー側では compose の web サービスを image: ghcr.io/kyong/misskey:<tag> にして
# `docker compose pull web && docker compose up -d web` で反映する。
name: Build chunchun image

on:
  push:
    tags:
      - 'chunchun-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chunchun-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/misskey

jobs:
  build:
    # upstream (misskey-dev/misskey) に誤って取り込まれても動かないようにする
    if: github.repository == 'kyong/misskey'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/chunchun-') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
